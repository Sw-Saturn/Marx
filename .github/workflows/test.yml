name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  composite-simulate:
    name: composite (${{ matrix.event }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - event: no_match
            expect: success
          - event: not_pr
            expect: success
          - event: approve
            # Dummy token causes the API call to return 401 Bad credentials,
            # so the step is expected to fail. Reaching that failure proves
            # the filter let the approve path through to the API call.
            expect: failure
    steps:
      - uses: actions/checkout@v4

      - name: Overwrite runner event payload with fixture
        run: cp "testdata/issue_comment_${{ matrix.event }}.json" "$GITHUB_EVENT_PATH"

      - name: Run composite action
        id: run
        continue-on-error: true
        uses: ./
        with:
          github-token: dummy-token

      - name: Verify outcome
        run: |
          expected="${{ matrix.expect }}"
          actual="${{ steps.run.outcome }}"
          if [ "$expected" != "$actual" ]; then
            echo "::error::expected outcome '$expected', got '$actual'"
            exit 1
          fi
