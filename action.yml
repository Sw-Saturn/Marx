name: "Slash Approve"
description: "Approve a pull request via slash command in comments"
inputs:
  github-token:
    description: "GitHub token with pull_requests:write. Self-approval (reviewer = PR author) requires a GitHub App installation token; PATs are rejected by GitHub in that case."
    required: true
  command:
    description: "Slash command to trigger approval"
    required: false
    default: "/approve"
runs:
  using: "docker"
  image: "Dockerfile"
  env:
    GITHUB_TOKEN: ${{ inputs.github-token }}
