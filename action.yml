name: "Slash Approve"
description: "Approve a pull request via slash command in comments"
inputs:
  github-token:
    description: "GitHub token with pull_requests:write. Self-approval (reviewer = PR author) requires a GitHub App installation token; PATs are rejected by GitHub in that case."
    required: true
  command:
    description: "Slash command to trigger approval"
    required: false
    default: "/approve"
runs:
  using: "composite"
  steps:
    - name: Slash approve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail

        # SLASH_APPROVE_EVENT_PATH is an internal override used by the Test
        # workflow to point at fixture payloads; production uses GITHUB_EVENT_PATH.
        event_path="${SLASH_APPROVE_EVENT_PATH:-${GITHUB_EVENT_PATH:-}}"
        if [ -z "$event_path" ] || [ ! -f "$event_path" ]; then
          echo "::error::GITHUB_EVENT_PATH is not set or file does not exist"
          exit 1
        fi
        if [ -z "${GITHUB_REPOSITORY:-}" ]; then
          echo "::error::GITHUB_REPOSITORY is not set"
          exit 1
        fi

        action=$(jq -r '.action // ""' "$event_path")
        if [ "$action" != "created" ]; then
          echo "skipping: event action is not 'created' (got '$action')"
          exit 0
        fi

        is_pr=$(jq -r '.issue.pull_request // empty' "$event_path")
        if [ -z "$is_pr" ]; then
          echo "skipping: comment is not on a pull request"
          exit 0
        fi

        body=$(jq -r '.comment.body // ""' "$event_path")

        if ! awk -v cmd="$INPUT_COMMAND" '
          {
            line = $0
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
            if (line == cmd) { found = 1 }
          }
          END { exit (found ? 0 : 1) }
        ' <<< "$body"; then
          echo "skipping: comment does not match command \"$INPUT_COMMAND\""
          exit 0
        fi

        number=$(jq -r '.issue.number' "$event_path")
        echo "approving PR #$number in $GITHUB_REPOSITORY"

        gh api \
          --method POST \
          -H "Accept: application/vnd.github+json" \
          "/repos/$GITHUB_REPOSITORY/pulls/$number/reviews" \
          -f event=APPROVE \
          > /dev/null

        echo "PR #$number approved successfully"
