name: "Slash Approve"
description: "Approve a pull request via slash command in comments"
inputs:
  github-token:
    description: "GitHub token with PR review permissions (PAT or GitHub App token required for self-approval)"
    required: true
  command:
    description: "Slash command to trigger approval"
    required: false
    default: "/approve"
runs:
  using: "docker"
  image: "Dockerfile"
  env:
    GITHUB_TOKEN: ${{ inputs.github-token }}
